# Signed release on a version tag:  npm run release -- 1.2.0  (tags v1.2.0)
# Produces a DRAFT GitHub Release; a maintainer smoke-tests and publishes it.
# Signing and the updater switch on per platform as their secrets are added
# (see docs/RELEASING.md); without them the installers are built unsigned.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    env:
      # Compiled into the app: enables the in-app updater (public key, not a secret).
      NGA_UPDATER_PUBKEY: ${{ vars.NGA_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci

      # Export only the signing secrets that exist: an empty APPLE_CERTIFICATE
      # would make the bundler try (and fail) to import a certificate.
      - name: Signing environment
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          put() { if [ -n "${!1}" ]; then { echo "$1<<__EOF__"; echo "${!1}"; echo "__EOF__"; } >> "$GITHUB_ENV"; fi; }
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do put $v; done
          if [ "$RUNNER_OS" = "macOS" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do put $v; done
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            fi
          fi
          # Updater artifacts (.sig + latest.json) only when we can sign them.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then updater=true; else updater=false; fi
          echo "{\"bundle\":{\"createUpdaterArtifacts\":$updater}}" > "$RUNNER_TEMP/release.conf.json"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NGA Desktop ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Windows: NGA_*_x64-setup.exe (everyone) or the .msi (school IT). macOS: NGA_*_universal.dmg."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config ${{ runner.temp }}/release.conf.json
