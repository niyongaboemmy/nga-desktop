# Release on a version tag:  npm run release -- 1.2.0  (tags v1.2.0), push --follow-tags.
#
# Builds the signed installers + update packages on Windows and macOS and
# uploads them, with a release.json manifest, to the NGA server
# (/opt/apps/desktop-releases/<version>/). That makes them downloadable for
# testing at https://api.amashuri.com/desktop/files/<version>/..., but NOT the
# version the download page offers or installed apps update to: run the
# "Publish release" workflow for that, after a smoke test (docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    env:
      # Compiled into the app: switches the in-app updater on (public key, not a secret).
      NGA_UPDATER_PUBKEY: ${{ vars.NGA_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci

      # Export only the signing secrets that exist: an empty APPLE_CERTIFICATE
      # would make the bundler try (and fail) to import a certificate.
      - name: Signing environment
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          put() { if [ -n "${!1}" ]; then { echo "$1<<__EOF__"; echo "${!1}"; echo "__EOF__"; } >> "$GITHUB_ENV"; fi; }
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$NGA_UPDATER_PUBKEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY (secret) and NGA_UPDATER_PUBKEY (variable) are required: installed apps could not update from this release."
            exit 1
          fi
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do put $v; done
          if [ "$RUNNER_OS" = "macOS" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do put $v; done
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            fi
          fi
          # The bundler signs the update packages and needs the updater config
          # (public key; the endpoint mirrors src-tauri/src/updates.rs).
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: {
                pubkey: process.env.NGA_UPDATER_PUBKEY.trim(),
                endpoints: ["https://api.amashuri.com/desktop/update/{{target}}/{{arch}}/{{current_version}}"],
              } },
            }));
          ' "$RUNNER_TEMP/release.conf.json"

      - name: Build
        shell: bash
        run: npx tauri build ${{ matrix.args }} --config "$RUNNER_TEMP/release.conf.json"

      # Installers + update packages (and their .sig), under one flat folder.
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = "macOS" ]; then
            B=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$B"/dmg/*.dmg out/
            cp "$B/macos/NGA.app.tar.gz" "out/NGA_${V}_universal.app.tar.gz"
            cp "$B/macos/NGA.app.tar.gz.sig" "out/NGA_${V}_universal.app.tar.gz.sig"
          else
            B=src-tauri/target/release/bundle
            cp "$B"/nsis/*-setup.exe "$B"/nsis/*-setup.exe.sig out/
            cp "$B"/msi/*.msi out/
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Manifest (release.json)
        run: node scripts/release-manifest.mjs dist > dist/release.json && cat dist/release.json
      - name: Upload to the NGA server (not published yet)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          V=$(node -p "require('./package.json').version")
          install -m 600 /dev/null key && printf '%s\n' "$EC2_SSH_KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new"
          $SSH "$EC2_USER@$EC2_HOST" "mkdir -p /opt/apps/desktop-releases/$V"
          rsync -az -e "$SSH" dist/ "$EC2_USER@$EC2_HOST:/opt/apps/desktop-releases/$V/"
          rm -f key
          {
            echo "### NGA Desktop $V uploaded (not published)"
            echo "Test it: https://api.amashuri.com/desktop/files/$V/ , then run **Publish release** with version $V."
          } >> "$GITHUB_STEP_SUMMARY"
