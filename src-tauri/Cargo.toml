[package]
name = "nga-desktop"
version = "0.5.0"
description = "NGA Desktop: one native app for NGA MIS, Task Mentor, Tendo and Tupo"
authors = ["New Generation Academy"]
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/niyongaboemmy/nga-desktop"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nga_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["image-png", "macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-process = "2.4.0"
url = "2.5.8"
log = "0.4.34"
tokio = { version = "1.53.2", features = ["time"] }
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tauri-plugin-global-shortcut]
version = "2.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSTextField", "NSControl", "NSView", "NSResponder", "NSButton", "NSWindow", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSError", "NSBundle", "NSObject"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationSettings", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationSound", "UNNotificationTrigger"] }
